name: Cause lists

# Watched companies' names in the cause lists courts publish a day or two ahead (Supreme Court, NCLAT, Delhi and
# Rajasthan High Courts), sent to the legal head on Telegram. Started by the database timer
# (pg_cron -> /api/cron/tick?job=causelists) or by hand. Runs only in the public repo.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Courts to read (sci, nclat, delhi_hc, raj_hc); blank = all"
        default: ""

permissions:
  contents: read

concurrency:
  group: causelists
  cancel-in-progress: false

jobs:
  read:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m haazir.causelists run ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
