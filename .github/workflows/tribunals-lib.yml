name: Tribunal judgments (library)

# Loads tribunals' published decisions into the judgments library (haazir.tribunals_lib): CAT and ATFP to begin with,
# both carrying on where the last run stopped (the progress file on Drive skips what is stored). One machine per tribunal,
# 3 requests at a time, stopping after `hours` so the 6-hour limit never cuts a decision in half; start it again to go on.
# Started by hand or by /api/cron/tick?job=tribunals-lib. Runs only in the public repo nimishwork6699/haazir-scanner.
on:
  workflow_dispatch:
    inputs:
      forums:
        description: "Tribunals, as a JSON list"
        default: '["cat", "atfp"]'
      hours:
        description: "Each machine stops after this many hours (5.5 at most)"
        default: "5.5"

concurrency:
  group: tribunals-lib    # one load per tribunal at a time; its own group so it never waits on the nightly jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        forum: ${{ fromJSON(inputs.forums || '["cat", "atfp"]') }}
    name: ${{ matrix.forum }}
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
      - name: Load the decisions
        # SIGINT first, so the load ends after the decision in hand (KILL 5 minutes later); stopping on time is not a failure,
        # and whatever is not stored is picked up next run.
        run: |
          MIN=$(python3 -c "print(int(min(float('${{ inputs.hours || '5.5' }}'), 5.5) * 60))")
          timeout -s INT -k 5m "${MIN}m" python -m haazir.tribunals_lib ${{ matrix.forum }} --workers 3 || { c=$?; [ $c -eq 124 ] || [ $c -eq 137 ]; }
