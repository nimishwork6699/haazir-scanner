name: Full texts and district summaries

on:
  # Started by hand or by /api/cron/tick?job=fulltext-sc | fulltext-hc | fulltext-dc | district. Runs only in the public
  # repo nimishwork6699/haazir-scanner. Reads public court records (AWS Open Data), writes Google Drive.
  # A run does only what is not stored yet, so it can simply be started again after a failure.
  workflow_dispatch:
    inputs:
      set:
        description: "sc | hc | dc (full texts) or district (summaries)"
        default: sc

jobs:
  plan:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      units: ${{ steps.plan.outputs.units }}
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - id: plan
        run: |
          n=$(python -m haazir.fulltext plan ${{ inputs.set || 'sc' }})
          echo "units=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  load:
    needs: plan
    if: needs.plan.outputs.units != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 15   # leaves free machines for searches and Find one case
      matrix:
        unit: ${{ fromJson(needs.plan.outputs.units) }}
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils > /dev/null
      - run: python -m haazir.fulltext run ${{ inputs.set || 'sc' }} ${{ matrix.unit }}
