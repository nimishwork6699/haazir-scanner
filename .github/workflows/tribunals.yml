name: Tribunals (NCLAT, CAT, APTEL)

# Watched companies' cases at NCLAT (both benches), CAT (19 benches) and APTEL, from their own public case status:
# new live cases join Our cases; next dates of saved ones are refreshed (haazir/tribunals.py).
# Started by the database timer (pg_cron -> /api/cron/tick?job=tribunals) or by hand. Not scheduled. Runs only in the public repo.
on:
  workflow_dispatch:
    inputs:
      company:
        description: "Only this company (short name); blank = every watched company"
        default: ""
      only:
        description: "Which tribunals (comma separated)"
        default: "nclat,cat,aptel"

permissions:
  contents: read

concurrency:
  group: tribunals
  cancel-in-progress: false

jobs:
  scan:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m haazir.tribunals scan --only "${{ inputs.only || 'nclat,cat,aptel' }}" --company "${{ inputs.company }}"
