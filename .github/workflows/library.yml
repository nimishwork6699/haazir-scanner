name: Library loads

on:
  # Started by hand or by /api/cron/tick?job=library (no inputs: every High Court year). Runs only in the public repo
  # nimishwork6699/haazir-scanner. Reads public court records (AWS Open Data), writes Backblaze / Google Drive.
  workflow_dispatch:
    inputs:
      task:
        description: "hc (High Court summaries)"
        default: hc
      first:
        description: "first year"
        default: "1950"
      last:
        description: "last year"
        default: "2026"

jobs:
  plan:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    outputs:
      years: ${{ steps.years.outputs.years }}
    steps:
      - id: years
        run: echo "years=$(python3 -c "import json; print(json.dumps(list(range(int('${{ inputs.first || '1950' }}'), int('${{ inputs.last || '2026' }}') + 1))))")" >> "$GITHUB_OUTPUT"

  load:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10   # leaves the other free machines for searches and Find one case
      matrix:
        year: ${{ fromJson(needs.plan.outputs.years) }}
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - if: ${{ (inputs.task || 'hc') == 'hc' }}
        run: python -m haazir.library hc-files ${{ matrix.year }}
