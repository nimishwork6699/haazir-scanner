name: Worker

# Every 10 minutes, a safety net behind the dashboard's instant start: Find one case requests still waiting, and
# searches still waiting or whose workers died get their cloud run started (lookup.yml, up to ten workers each),
# then blank parties and sides are filled from case pages (haazir.fill).
# Runs only in the public repo nimishwork6699/haazir-scanner, where Actions are free.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  kick:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # eCourts answers only Indian addresses: Find one case and the party fill reach it through the Mumbai relay
      # (haazir/relay.py). Repository variable ECOURTS_RELAY picks supabase, vercel or off.
      ECOURTS_RELAY: ${{ vars.ECOURTS_RELAY || 'vercel' }}
      ECOURTS_RELAY_KEY: ${{ secrets.ECOURTS_RELAY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - name: Find one case
        run: python -m haazir.find run
      - name: Start waiting searches
        if: always()
        run: python -m haazir.lookup kick
      - name: Fill blank parties and sides
        # Reads case pages for search results whose list showed one party ("ICICI Lombard vs ___"), slowly, for at
        # most 6 minutes, so it is done before the next Worker run starts. Stops at once if eCourts refuses.
        if: always()
        run: python -m haazir.fill run --minutes 6
