name: Worker

# Every 10 minutes, a safety net behind the dashboard's instant start: Find one case requests still waiting, and
# searches still waiting or whose workers died get their cloud run started (lookup.yml, up to ten workers each).
# Runs only in the public repo nimishwork6699/haazir-scanner, where Actions are free.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  kick:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      APP_URL: ${{ vars.APP_URL }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - name: Find one case
        run: python -m haazir.find run
      - name: Start waiting searches
        if: always()
        run: python -m haazir.lookup kick
