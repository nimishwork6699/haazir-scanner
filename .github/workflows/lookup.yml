name: Search courts

# One search from the dashboard (Search courts, Load more, Watch) or from the Worker: plan its court searches, then
# start up to 18 workers side by side (2 of GitHub's 20 stay free for Find one case). Each is a separate runner with its own address and takes the next court
# search from the shared list, so all of them stay busy whatever the search covers. A run that runs out of time
# starts the next one itself (Carry on). Runs only in the public repo nimishwork6699/haazir-scanner, where Actions
# are free.
on:
  workflow_dispatch:
    inputs:
      lookup_id:
        description: "Search to run (blank = the oldest waiting search)"
        default: ""
      find_id:
        description: "Find one case by CNR (Search courts -> Find one case); skips the searches"
        default: ""
      chain:
        description: "How many runs in a row this search has started itself (stops at 30)"
        default: "0"

permissions:
  actions: write
  contents: read

# Each search runs on its own; two searches can run at once.
concurrency:
  group: search-${{ inputs.lookup_id || inputs.find_id || 'next' }}
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  APP_URL: ${{ vars.APP_URL }}
  # eCourts answers only Indian addresses: reach it through the Mumbai relay (haazir/relay.py). Repository variable
  # ECOURTS_RELAY picks supabase, vercel or off; workers alternate between the two (odd supabase, even vercel). With the
  # relay on, a search starts at most 8 workers (haazir.lookup RELAY_MAX_WORKERS).
  ECOURTS_RELAY: ${{ vars.ECOURTS_RELAY || 'supabase' }}
  ECOURTS_RELAY_KEY: ${{ secrets.ECOURTS_RELAY_KEY }}

jobs:
  find:
    if: github.repository == 'nimishwork6699/haazir-scanner' && inputs.find_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m haazir.find run --id "${{ inputs.find_id }}"

  plan:
    if: github.repository == 'nimishwork6699/haazir-scanner' && inputs.find_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      id: ${{ steps.plan.outputs.id }}
      workers: ${{ steps.plan.outputs.workers }}
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - id: plan
        run: python -m haazir.lookup plan --id "${{ inputs.lookup_id }}"
      - name: Watch requests
        if: always()
        run: python -m haazir.watch run

  work:
    needs: plan
    if: needs.plan.outputs.id != '' && needs.plan.outputs.workers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - run: |
          # Every worker through Supabase, unless the repository variable fixes one (or off).
          if [ -z "${{ vars.ECOURTS_RELAY }}" ]; then
            export ECOURTS_RELAY=supabase  # 31 Oct: eCourts' district site stopped answering Vercel's Mumbai address (connect timeouts), so every job uses Supabase.
          fi
          python -m haazir.lookup work --id "${{ needs.plan.outputs.id }}" --worker "${{ matrix.worker }}" --max-minutes 330

  carry-on:
    # Workers that ran out of time leave court searches open: start the next run now. At most 30 runs in a row,
    # so a court site that keeps refusing cannot loop forever (the Worker picks it up again later).
    needs: [plan, work]
    if: always() && needs.plan.outputs.id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scanner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="${{ needs.plan.outputs.id }}"; chain="${{ inputs.chain }}"; chain="${chain:-0}"
          left=$(python -m haazir.lookup next --id "$id")
          if [ -z "$left" ]; then echo "Search finished."; exit 0; fi
          if [ "$chain" -ge 30 ]; then echo "30 runs in a row; the Worker carries on later."; exit 0; fi
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/lookup.yml/dispatches" \
            -d "{\"ref\":\"main\",\"inputs\":{\"lookup_id\":\"$id\",\"chain\":\"$((chain + 1))\"}}"
          echo "Started the next run."
