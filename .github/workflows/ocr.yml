name: OCR library documents

on:
  # Runs only in the public repo nimishwork6699/haazir-scanner. Reads the library's text files and their PDFs from
  # Backblaze and Google Drive, OCRs the scanned or unreadable ones (tesseract, Hindi and English) and writes the text
  # files back. A run does only what is not OCR'd yet, so it can simply be started again.
  # Started by hand (gh workflow run ocr.yml -f items="..."), or by publishing a change to scanner/ocr-request.txt
  # (its "items:", "try:" and "stores:" lines are then the inputs).
  workflow_dispatch:
    inputs:
      items:
        description: "items to OCR; item:folder for one folder (e.g. 10 11 18 21 22 24 25 27 28 29 31 33:ibbi 33:tdsat 33:cci 33:aptel 33:gst-aar)"
        default: "10 11 18 21 22 24 25 27 28 29 31 33:ibbi 33:tdsat 33:cci 33:aptel 33:gst-aar"
      try:
        description: "test only: '<store> <text file path> <n>' (several joined by ';') OCRs n documents of each file into Drive work/ocr-try/ (the library is not changed); blank for a real run"
        default: ""
      stores:
        description: "stores the run may download from: drive (Backblaze kept for the website: its free daily download cap is small) or b2,drive"
        default: "drive"
  push:
    branches: [main]
    paths: [scanner/ocr-request.txt]

jobs:
  request:
    if: github.repository == 'nimishwork6699/haazir-scanner'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      items: ${{ steps.r.outputs.items }}
      try: ${{ steps.r.outputs.try }}
      stores: ${{ steps.r.outputs.stores }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          IN_ITEMS: ${{ inputs.items }}
          IN_TRY: ${{ inputs.try }}
          IN_STORES: ${{ inputs.stores }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            items="$IN_ITEMS"; try="$IN_TRY"; stores="$IN_STORES"
          else
            items=$(sed -n 's/^items:[[:space:]]*//p' scanner/ocr-request.txt | head -1)
            try=$(sed -n 's/^try:[[:space:]]*//p' scanner/ocr-request.txt | head -1)
            stores=$(sed -n 's/^stores:[[:space:]]*//p' scanner/ocr-request.txt | head -1)
          fi
          stores="${stores:-drive}"
          echo "items=$items" >> "$GITHUB_OUTPUT"
          echo "try=$try" >> "$GITHUB_OUTPUT"
          echo "stores=$stores" >> "$GITHUB_OUTPUT"
          echo "items: $items"; echo "try: $try"; echo "stores: $stores"

  try:
    needs: request
    if: needs.request.outputs.try != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      TRY: ${{ needs.request.outputs.try }}
      OCR_STORES: ${{ needs.request.outputs.stores }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      # Hindi and English for almost everything; the other Indian languages for the states' acts and the Constitution's
      # language editions; osd tells a page's script.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-osd > /dev/null
          sudo apt-get install -y -qq tesseract-ocr-asm tesseract-ocr-ben tesseract-ocr-guj tesseract-ocr-kan tesseract-ocr-mal tesseract-ocr-mar tesseract-ocr-nep tesseract-ocr-ori tesseract-ocr-pan tesseract-ocr-san tesseract-ocr-snd tesseract-ocr-tam tesseract-ocr-tel tesseract-ocr-urd > /dev/null
          tesseract --list-langs | tr '\n' ' '
      - run: |
          echo "$TRY" | tr ';' '\n' | while read -r store path n; do
            if [ -n "$path" ]; then python -m haazir.ocr try "$store" "$path" "${n:-3}" < /dev/null; fi
          done

  plan:
    needs: request
    if: needs.request.outputs.try == '' && needs.request.outputs.items != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      units: ${{ steps.plan.outputs.units }}
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      ITEMS: ${{ needs.request.outputs.items }}
      OCR_STORES: ${{ needs.request.outputs.stores }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      - id: plan
        run: |
          n=$(python -m haazir.ocr plan "$ITEMS")
          echo "units=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  ocr:
    needs: [request, plan]
    if: needs.plan.outputs.units != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 10   # leaves free machines for the court searches and Find one case
      matrix:
        unit: ${{ fromJson(needs.plan.outputs.units) }}
    defaults:
      run:
        working-directory: scanner
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      ITEMS: ${{ needs.request.outputs.items }}
      OCR_STORES: ${{ needs.request.outputs.stores }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r requirements.txt
      # Hindi and English for almost everything; the other Indian languages for the states' acts and the Constitution's
      # language editions; osd tells a page's script.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-hin tesseract-ocr-osd > /dev/null
          sudo apt-get install -y -qq tesseract-ocr-asm tesseract-ocr-ben tesseract-ocr-guj tesseract-ocr-kan tesseract-ocr-mal tesseract-ocr-mar tesseract-ocr-nep tesseract-ocr-ori tesseract-ocr-pan tesseract-ocr-san tesseract-ocr-snd tesseract-ocr-tam tesseract-ocr-tel tesseract-ocr-urd > /dev/null
          tesseract --list-langs | tr '\n' ' '
      - run: python -m haazir.ocr run "$ITEMS" ${{ matrix.unit }}
